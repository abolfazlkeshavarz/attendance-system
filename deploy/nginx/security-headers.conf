# هدرهای امنیتی این پروژه — روی nginx سطح میزبان نصب می‌شود.
#
# اسم فایل عمداً attendance- دارد، نه یک اسم عمومی مثل security-headers.conf:
# روی این VPS چند پروژه دیگر هم nginx سطح میزبان مشترک را استفاده می‌کنند و
# هرکدام Permissions-Policy متفاوتی لازم دارند (این‌جا camera=(self) چون
# تبلت ورودی از دوربین همین دامنه برای تشخیص چهره استفاده می‌کند). یک اسم
# مشترک باعث می‌شد اسکریپت استقرار یک پروژه، تنظیمات پروژه دیگر را رونویسی
# کند.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
