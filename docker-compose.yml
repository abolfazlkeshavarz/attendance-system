name: attendance

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD را در فایل .env تنظیم کنید}
      TZ: ${TIMEZONE:-Asia/Tehran}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attendance} -d ${POSTGRES_DB:-attendance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # پایگاه داده هیچ پورتی به بیرون باز نمی‌کند؛ فقط از شبکه داخلی در دسترس است

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-attendance}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-attendance}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY را در فایل .env تنظیم کنید}
      FIRST_ADMIN_USERNAME: ${FIRST_ADMIN_USERNAME:-admin}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-admin1234}
      FIRST_ADMIN_NAME: ${FIRST_ADMIN_NAME:-مدیر سامانه}
      TIMEZONE: ${TIMEZONE:-Asia/Tehran}
      DEBUG: "false"
      # پشت HTTPS هستیم، پس کوکی تصاویر فقط روی اتصال امن برود
      SECURE_COOKIES: "true"
      CORS_ORIGINS: https://${DOMAIN}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.60}
      REQUIRE_LIVENESS: ${REQUIRE_LIVENESS:-true}
      LIVENESS_TURN_THRESHOLD: ${LIVENESS_TURN_THRESHOLD:-0.06}
      LIVENESS_TIMEOUT_SECONDS: ${LIVENESS_TIMEOUT_SECONDS:-12}
    volumes:
      # تصاویر چهره و عکس ترددها باید از بازسازی کانتینر جان سالم به در ببرند
      - media:/app/app/static

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN را در فایل .env تنظیم کنید}
      BACKEND_UPSTREAM: backend:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    # هر ۶ ساعت پیکربندی را دوباره می‌خواند تا گواهی تمدیدشده اعمال شود.
    #
    # صدا زدن صریح /docker-entrypoint.sh لازم است و اضافی نیست: اسکریپت ورودیِ
    # تصویر رسمی nginx فقط وقتی قالب‌های conf را با envsubst پردازش می‌کند که
    # آرگومان اولش دقیقاً «nginx» باشد. چون اینجا فرمان با /bin/sh شروع می‌شود،
    # آن مرحله رد می‌شود و nginx بی‌سروصدا با پیکربندی پیش‌فرض بالا می‌آید.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
                  exec /docker-entrypoint.sh nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # هر ۱۲ ساعت تمدید را بررسی می‌کند (certbot خودش می‌داند زود است یا نه)
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet;
                  sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  media:
  certbot_conf:
  certbot_www:
