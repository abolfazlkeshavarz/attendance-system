[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.3
    bblanchon/ArduinoJson @ ^7.1.0
    tzapu/WiFiManager @ ^2.0.17
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Set to 1 only for bench testing without a valid TLS cert configured (see src/certs.h).
    ; Never ship a unit with this on — it disables server certificate validation.
    -DFP_TLS_INSECURE=0
