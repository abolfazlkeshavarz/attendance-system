# هدرهای امنیتی مشترک.
#
# چرا فایل جداست و همه‌جا include می‌شود؟
# در nginx، هر location که خودش add_header داشته باشد، *همه* هدرهای ارث‌بری‌شده
# از سطح بالاتر را دور می‌ریزد. اگر این‌ها را فقط یک‌بار در بلوک server بنویسیم،
# صفحه اصلی برنامه (که برای کنترل کش، add_header خودش را دارد) بدون هدر امنیتی
# سرو می‌شود — از جمله بدون Permissions-Policy که اجازه دوربین را می‌دهد.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# دوربین فقط برای خود سامانه مجاز است؛ تبلت بدون این نمی‌تواند چهره بخواند
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
