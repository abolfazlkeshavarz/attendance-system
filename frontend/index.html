<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>سامانه حضور و غیاب</title>
      <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // تبلت ورودی (/kiosk) مانیفست خودش را دارد؛ بقیه مسیرها پنل مدیریت‌اند.
      // لینک فقط همین‌جا و یک‌بار ساخته می‌شود تا مرورگر مانیفست اشتباه را نبیند.
      (function () {
        var kiosk = location.pathname.indexOf('/kiosk') === 0
        var l = document.createElement('link')
        l.rel = 'manifest'
        l.href = kiosk ? '/manifest.webmanifest' : '/panel.webmanifest'
        document.head.appendChild(l)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
